enum Retailer {
  PNP
  SHOPRITE
  CHECKERS
  BOXER
  EVERGREEN
}

type User @table {
  isGuest: Boolean!
  lastActive: Timestamp
}

type Account @table {
  user: User!
  userName: String!
  lastName: String!
  firstName: String!
  city: String!
  province: String!
  postalCode: String!
  homeAddress: String!
  email: String!
  phoneNumber: String!
  gender: String!
  dateOfBirth: String
  password: String!
}

type NutritionConstraint @table {
  user: User!
  timestamp: Timestamp!
}

type DietaryPreference @table {
  nutritionConstraint: NutritionConstraint!
  value: String!
}

type Allergen @table {
  nutritionConstraint: NutritionConstraint!
  value: String!
}

type SpendingConstraint @table {
  user: User!
  minimum: Int
  maximum: Int
}

type List @table {
  user: User!
  name: String!
  createdAt: Timestamp!
}

type Store @table(key: "storeCode") {
  storeCode: String!
  name: String!
  city: String!
  province: String!
  postalCode: String!
  streetAddress: String!
}

type Product @table(key: "productCode") {
  productCode: String! 
  description: String
  barcode: String
  name: String!
  category: String
  subcategory: String
  store: Retailer!
  imageUrl: String
}

type Price @table(key: "product") {
  product: Product!
  store: Store!
  price: Float!
  originalPrice: Float
  savings: Float
  onSpecial: Boolean!
  promotionDescription: String
  dateRecorded: Timestamp!
}

type Availability @table {
  product: Product!
  store: Store!
}

type ListItem @table {
  list: List!
  product: Product!
  quantity: Int!
  addedAt: Timestamp!
}

type PriceAlert @table {
  user: User!
  product: Product!
  thresholdPrice: Float!
  createdAt: Timestamp!
}

type PriceHistory @table(key: "product") {
  product: Product!
  store: Store!
  price: Float!
  promotionPrice: Float!
  recordedAt: Timestamp!
}